<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2f6b">
  <script>
    try {
      const th = localStorage.getItem("nosarara_theme") === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = th;
      const mt = document.querySelector('meta[name="theme-color"]');
      if (mt) mt.content = th === "dark" ? "#0a0e14" : "#1b2f6b";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <title>Nosarara Stok – Pengelolaan Stok Toko Baju</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%232557d6'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript><p style="padding:16px;color:#1b2433">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
  <div id="app"></div>
  <div id="m"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
